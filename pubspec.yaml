name: leavelist
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

# environment
environment:
  sdk: ^3.12.2


# client dependencies
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  hugeicons_pro: ^0.0.3
  svg_flutter: ^0.0.1
  google_maps_flutter: ^2.18.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^3.4.3

# dev dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1


# native assets

flutter:
  uses-material-design: true


  assets:
    - assets/fonts/                       # custom fonts
    - assets/images/                      # images used in app

  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
